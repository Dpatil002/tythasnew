name: Tythas Team
role: Growth team, Tythas Digital
shortBio: The designers, developers and marketers at Tythas Digital, writing about what actually brings businesses customers online.
bio: |-
  The Tythas team is a group of designers, developers and growth marketers based in Pune, India. For 5 years we have designed and built websites, apps and growth systems for businesses in India and abroad.

  We work with founders from the first idea through launch, and then on the SEO, ads and conversion work that brings in customers.

  Here we share what we learn along the way: websites, AI search, product design and what it takes to go from idea to MVP.
expertise:
  - UI/UX and product design
  - Conversion-focused websites
  - SEO and AI search (AEO)
  - Idea to MVP
