name: Digambar Patil
role: Founder, Tythas Digital
shortBio: Product and UI/UX designer who helps businesses turn websites, products and marketing into systems that bring in customers.
bio: |-
  Digambar Patil is the founder of Tythas Digital, a growth agency based in Pune, India. He is a product and UI/UX designer with 5 years of experience designing and building websites, apps and growth systems for businesses in India and abroad.

  At Tythas he leads strategy and design, working with founders from the first idea through launch, and then on the SEO, ads and conversion work that brings in customers.

  He writes about websites, AI search, product design and what it takes to go from idea to MVP.
expertise:
  - UI/UX and product design
  - Conversion-focused websites
  - SEO and AI search (AEO)
  - Idea to MVP
